<div class="relative w-full max-w-[560px] mx-auto select-none">
  <div
    aria-hidden="true"
    class="absolute -inset-4 rounded-full bg-radial from-[#7652EA]/20 via-[#F3F0FF]/70 to-transparent blur-2xl pointer-events-none"
  ></div>

  <svg
    viewBox="0 0 600 480"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
    class="relative w-full h-auto drop-shadow-[0_24px_48px_rgba(25,19,79,0.14)]"
    role="img"
    aria-label="3D-style illustration of a laptop displaying a CV document, a purple briefcase, and a magnifying glass"
  >
    <defs>
      <linearGradient id="bgWave" x1="60" y1="60" x2="540" y2="430" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#ECE6FF" />
        <stop offset="55%" stop-color="#E1D8FF" />
        <stop offset="100%" stop-color="#F3F0FF" />
      </linearGradient>

      <linearGradient id="laptopLid" x1="115" y1="125" x2="430" y2="320" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#3B258E" />
        <stop offset="100%" stop-color="#19134F" />
      </linearGradient>
      <linearGradient id="laptopScreen" x1="130" y1="135" x2="415" y2="305" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#2A1D72" />
        <stop offset="100%" stop-color="#150F42" />
      </linearGradient>
      <linearGradient id="laptopBase" x1="65" y1="300" x2="465" y2="405" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#DCD5FA" />
        <stop offset="55%" stop-color="#C1B5F4" />
        <stop offset="100%" stop-color="#9E8EEB" />
      </linearGradient>
      <linearGradient id="laptopBaseSide" x1="65" y1="360" x2="465" y2="415" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#654AD1" />
        <stop offset="100%" stop-color="#3E289E" />
      </linearGradient>

      <linearGradient id="briefcaseBody" x1="355" y1="95" x2="520" y2="235" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#7652EA" />
        <stop offset="55%" stop-color="#5421D6" />
        <stop offset="100%" stop-color="#2B167A" />
      </linearGradient>
      <linearGradient id="briefcaseFlap" x1="365" y1="92" x2="510" y2="170" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#8E6EF7" />
        <stop offset="100%" stop-color="#5421D6" />
      </linearGradient>

      <linearGradient id="cvPaper" x1="185" y1="55" x2="380" y2="310" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#FFFFFF" />
        <stop offset="100%" stop-color="#F4F0FF" />
      </linearGradient>

      <linearGradient id="lensRim" x1="315" y1="190" x2="450" y2="335" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#6D48E5" />
        <stop offset="50%" stop-color="#2E1C80" />
        <stop offset="100%" stop-color="#19134F" />
      </linearGradient>
      <linearGradient id="lensGlass" x1="320" y1="200" x2="420" y2="300" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
        <stop offset="50%" stop-color="#C4B5FD" stop-opacity="0.32" />
        <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.22" />
      </linearGradient>
      <linearGradient id="handleGrad" x1="415" y1="295" x2="480" y2="365" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#3E289E" />
        <stop offset="100%" stop-color="#19134F" />
      </linearGradient>

      <filter id="softShadow" x="-15%" y="-15%" width="135%" height="135%">
        <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#19134F" flood-opacity="0.16" />
      </filter>
      <filter id="cardShadow" x="-15%" y="-15%" width="135%" height="135%">
        <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#5421D6" flood-opacity="0.18" />
      </filter>
    </defs>

    <path
      d="M92 152C122 86 205 56 292 66C379 76 485 110 518 192C551 274 504 374 420 404C336 434 218 430 144 384C70 338 62 218 92 152Z"
      fill="url(#bgWave)"
    />

    <g stroke="#5421D6" stroke-width="3.5" stroke-linecap="round" opacity="0.85">

      <line x1="112" y1="154" x2="94" y2="152" />
      <line x1="146" y1="106" x2="140" y2="86" />
    </g>

      <path
        d="M412 104V86C412 79 418 74 425 74H461C468 74 474 79 474 86V104"

      <rect x="436" y="166" width="12" height="10" rx="3" fill="#5421D6" />
    </g>

    <!-- 3D Isometric Laptop -->
    <g filter="url(#softShadow)">
      <path
        d="M150 110C152 100 161 93 171 95L428 148C438 150 444 159 442 169L414 307L122 246L150 110Z"
        fill="url(#laptopLid)"
      />
      <path
        d="M161 118C162 112 168 108 174 110L419 160C425 161 429 167 428 173L403 295L136 239L161 118Z"

      />
      <path
        d="M122 246L414 307L328 394C322 400 313 402 305 400L56 336C47 334 43 324 49 317L122 246Z"

      <path

      <g fill="#B1A2EF" opacity="0.72">
        <path d="M129 264L368 315L350 334L111 282L129 264Z" />
        <path d="M104 288L343 340L325 359L86 306L104 288Z" />
      </g>
      <path
        d="M150 330L234 349L215 369L131 349L150 330Z"
        fill="#EDE9FE"
        stroke="#9E8EEB"
        stroke-width="1.5"
      />
    </g>

    <!-- Floating CV Document -->
    <g transform="rotate(8 285 185)" filter="url(#cardShadow)">
      <rect
        x="196"
        y="62"
        width="184"
        height="236"
        rx="16"
        fill="url(#cvPaper)"
        stroke="#E5DDFD"
        stroke-width="2"
      />
      <text
        x="220"
        y="102"
        fill="#5421D6"
        font-family="Plus Jakarta Sans, sans-serif"

      <rect x="218" y="118" width="44" height="48" rx="10" fill="#ECE6FF" />

      <path d="M226 158C226 150 232 146 240 146C248 146 254 150 254 158" fill="#5421D6" />
      <rect x="276" y="122" width="76" height="9" rx="4.5" fill="#5421D6" opacity="0.85" />
      <rect x="276" y="139" width="60" height="7" rx="3.5" fill="#9E8EEB" />
      <rect x="276" y="153" width="68" height="7" rx="3.5" fill="#C7BCF6" />
      <rect x="218" y="184" width="136" height="8" rx="4" fill="#B5A7F2" />
      <rect x="218" y="202" width="118" height="8" rx="4" fill="#D4CBFA" />
      <rect x="218" y="220" width="128" height="8" rx="4" fill="#D4CBFA" />
      <rect x="218" y="244" width="64" height="10" rx="5" fill="#16A66A" opacity="0.85" />

      <rect x="218" y="264" width="110" height="8" rx="4" fill="#DCD5FA" />
    </g>

    <!-- Magnifying Glass -->
    <g filter="url(#softShadow)">
      <path
        d="M417 296L474 353C481 360 481 371 474 378C467 385 456 385 449 378L392 321L417 296Z"
        fill="url(#handleGrad)"
      />
      <rect
        x="401"
        y="293"
        width="18"
        height="24"
        rx="6"
        transform="rotate(-45 401 293)"
        fill="#8E6EF7"
      />
      <circle cx="366" cy="252" r="64" fill="url(#lensRim)" />
      <circle cx="366" cy="252" r="52" fill="#F7F6FC" />
      <circle cx="366" cy="252" r="49" fill="url(#lensGlass)" />
      <g opacity="0.9">
        <rect x="334" y="232" width="58" height="9" rx="4.5" fill="#5421D6" />
        <rect x="334" y="248" width="46" height="8" rx="4" fill="#16A66A" />
        <rect x="334" y="263" width="52" height="8" rx="4" fill="#7652EA" opacity="0.7" />
      </g>
      <path
        d="M332 224C341 212 357 207 372 209"
        stroke="#FFFFFF"
        stroke-width="4.5"
        stroke-linecap="round"
        opacity="0.85"
      />

    <!-- Floating Verified Card -->
    <g filter="url(#cardShadow)">
      <rect x="86" y="200" width="96" height="44" rx="12" fill="#FFFFFF" stroke="#E9E5F2" stroke-width="1.5" />
      <circle cx="110" cy="222" r="11" fill="#E8F8F1" />
      <path
        d="M105 222L108.5 225.5L115.5 218.5"

      <rect x="128" y="214" width="40" height="6" rx="3" fill="#17152F" />
      <rect x="128" y="224" width="28" height="5" rx="2.5" fill="#7652EA" opacity="0.75" />
