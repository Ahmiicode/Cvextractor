<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}SkillAlign — AI-Powered Resume to Job Matching{% endblock %}</title>
    <meta
      name="description"
      content="AI-Powered Resume to Job Matching System built with Python Flask, spaCy, scikit-learn, PyMuPDF, and python-docx."
    />
    <meta property="og:title" content="SkillAlign — AI-Powered Resume to Job Matching" />
    <meta
      property="og:description"
      content="Analyze your PDF or DOCX resume against any job description using spaCy skill extraction and scikit-learn TF-IDF cosine similarity."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
  </head>
  <body class="bg-[#F7F6FC] text-[#17152F] antialiased">
    {% block content %}{% endblock %}
    {% block scripts %}{% endblock %}
  </body>
</html>
